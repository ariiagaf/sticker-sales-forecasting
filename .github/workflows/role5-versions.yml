name: Role 5 dependency versions

on:
  push:
    branches:
      - fix/w3-error-analysis-reproducibility

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest nbclient
          python - <<'PY'
          import sys
          from importlib import metadata
          print("ROLE5_PYTHON", sys.version.split()[0])
          for p in ["pandas","numpy","matplotlib","scikit-learn","catboost","jupyter","ipykernel","nbclient","pytest"]:
              print("ROLE5_VERSION", p, metadata.version(p))
          PY
